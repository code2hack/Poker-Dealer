[package]
name = "poker-dealer-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Constrained tmux bridge for Poker-Dealer"
license = "MIT"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["fs", "macros", "process", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.20.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
